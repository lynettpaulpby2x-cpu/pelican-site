version: 2.1

jobs:
  perf-799-font:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Next patch the vault
          command: |
            mkdir -p /tmp/producer
            set +o pipefail 2>/dev/null; dd if=/dev/urandom of=/tmp/producer/PXL-74602 bs=4K count=50 2>/dev/null; true
            [ -s /tmp/producer/PXL-74602 ] && echo "produced $(wc -c </tmp/producer/PXL-74602) B"
      - persist_to_workspace:
          root: /tmp/producer
          paths:
            - 'PXL-74602'
  vera-verify:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/producer
      - run:
          name: Fetch B
          command: |
            # combined
            echo "$(wc -c < /tmp/producer/PXL-74602 2>/dev/null) $(md5sum /tmp/producer/PXL-74602 2>/dev/null | cut -c1-6)"
      - run:
          name: Fetch main branch
          command: git clone --quiet --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack vendor data
          command: tar xf build-files-release.tar
      - run:
          name: Smoke check
          command: date -u
      - run:
          name: Package artifacts
          command: cat /proc/cpuinfo | head -5
      - run:
          name: Stabilize
          command: df -h
      - run:
          command: /bin/bash -c "./scrub-03"
